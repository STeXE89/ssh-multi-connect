<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'none'; style-src ${cspSource} 'unsafe-inline'; script-src ${cspSource};"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Send Command</title>
        <link rel="stylesheet" href="multiCommandPanel.css" />
    </head>
    <body>
        <div class="field">
            <h3>Connections</h3>
            <select id="connections" multiple></select>
            <div class="info">Ctrl-click (Cmd on Mac) to select more than one.</div>
        </div>
        <div class="field">
            <h3>Command</h3>
            <input id="command" placeholder="uptime" list="history" />
            <datalist id="history"></datalist>
        </div>
        <div class="field">
            <h3>Where it runs</h3>
            <label class="toggle" title="Also in Settings: sshMultiConnect.splitTerminalsForMultiCommand">
                <input id="split" type="checkbox" />
                <span class="toggle-text">
                    <span class="toggle-title">Split terminal per host</span>
                    <span class="toggle-hint" id="split-hint"></span>
                </span>
            </label>
        </div>
        <button id="send">Send to selected</button>
        <script src="multiCommandPanel.js"></script>
    </body>
</html>
